    <!-- Supabase Giriş / Kayıt Fonksiyonları -->
    <script>
      function uydurmaEmail(kadi) {
        return kadi.trim().toLowerCase() + "@gyspro.local";
      }

      async function kayitOl() {
        const kadi = document.getElementById('username').value;
        const sifre = document.getElementById('piri-sifre').value;
        
        if (!kadi || !sifre) {
          alert("Kullanıcı adı ve şifre boş olamaz!");
          return;
        }

        const email = uydurmaEmail(kadi);

        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: sifre,
        });

        if (error) {
          alert("Kayıt hatası: " + error.message);
          return;
        }

        if (data.user) {
          const { error: profileError } = await supabaseClient
            .from('profiles')
            .insert([{ id: data.user.id, username: kadi }]);

          if (profileError) {
            alert("Profil oluşturulamadı: " + profileError.message);
          } else {
            alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
          }
        }
      }

      async function girisYap() {
        const kadi = document.getElementById('username').value;
        const sifre = document.getElementById('piri-sifre').value;

        if (!kadi || !sifre) {
          alert("Lütfen kullanıcı adı ve şifrenizi girin!");
          return;
        }

        const email = uydurmaEmail(kadi);

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: sifre,
        });

        if (error) {
          alert("Giriş başarısız: " + error.message);
        } else {
          alert("Giriş başarılı!");
          document.getElementById('auth-container').style.display = 'none';
        }
      }
    </script>
